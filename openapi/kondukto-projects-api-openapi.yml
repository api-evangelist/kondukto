  /api/v2/projects/{projectID}/release:
    get:
      summary: Project Security Criteria Status
      description: This endpoint retrieves security creteria of the specific project.
      operationId: project-security-criteria-status
      parameters:
      - name: X-Cookie
        in: header
        description: Personal Access Token
        required: true
        schema:
          type: string
          default: Token
      - name: '{projectID}'
        in: path
        description: The ID of the project to retrieve scan criteria
        schema:
          type: string
        required: true
      - name: branch
        in: query
        description: The branch of the project to retrieve security criteria status. When not provided, the security criteria status of the project default branch will be returned.
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                    progress_status: ready
                    status: fail
                    sast:
                      status: success
                    dast:
                      status: success
                    pentest:
                      status: success
                    iast:
                      status: success
                    sca:
                      status: success
                    cs:
                      status: fail
                    iac:
                      status: success
                    mast:
                      status: ''
                    sbom:
                      status: undefined
              schema:
                type: object
                properties:
                  progress_status:
                    type: string
                    example: ready
                  status:
                    type: string
                    example: fail
                  sast:
                    type: object
                    properties:
                      status:
                        type: string
                        example: success
                  dast:
                    type: object
                    properties:
                      status:
                        type: string
                        example: success
                  pentest:
                    type: object
                    properties:
                      status:
                        type: string
                        example: success
                  iast:
                    type: object
                    properties:
                      status:
                        type: string
                        example: success
                  sca:
                    type: object
                    properties:
                      status:
                        type: string
                        example: success
                  cs:
                    type: object
                    properties:
                      status:
                        type: string
                        example: fail
                  iac:
                    type: object
                    properties:
                      status:
                        type: string
                        example: success
                  mast:
                    type: object
                    properties:
                      status:
                        type: string
                        example: ''
                  sbom:
                    type: object
                    properties:
                      status:
                        type: string
                        example: undefined
        '400':
          description: '400'
