openapi: 3.2.0
info:
  title: vulnerabilities Import API
  version: '2.0'
servers:
- url: https://{hostname}/api/v2/vulnerabilities
  variables:
    hostname:
      default: hostname
security:
- {}
tags:
- name: Import
paths:
  /import/sast:
    post:
      summary: Create a SAST Vulnerability
      description: This endpoint allows you to create SAST vulnerabilities for a specific project. The scan details and vulnerabilities identified during the scan are included in the request body.
      operationId: create-a-sast-vulnerability
      parameters:
      - name: X-Cookie
        in: header
        description: Personal Access Token
        required: true
        schema:
          type: string
          default: Token
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                project:
                  properties:
                    id:
                      type: string
                      description: The unique identifier of the project.
                  required:
                  - id
                  type: object
                scan_details:
                  properties:
                    tool:
                      type: string
                      description: The name of the scanning tool used (e.g., "gosec").
                    branch:
                      type: string
                      description: The project branch where the scan was conducted (e.g., "master").
                    meta_data:
                      type: string
                      description: A unique identifier added by the user.
                    date_discovered:
                      type: string
                      description: The date and time when the scan was conducted. The format must be ISO 8601 format.
                    discovered_by:
                      type: string
                      description: The person who conducted the scan (e.g., "john").
                  required:
                  - tool
                  - branch
                  - date_discovered
                  type: object
                vulnerabilities:
                  properties:
                    name:
                      type: string
                      description: The name of the vulnerability.
                    discovered_by:
                      type: string
                      description: The person or entity who discovered the vulnerability (e.g., "john").
                    cwe_id:
                      type: integer
                      description: The Common Weakness Enumeration (CWE) identifier for the vulnerability.
                      format: int32
                    cvss_v3:
                      type: number
                      description: The Common Vulnerability Scoring System (CVSS) v3 score for the vulnerability.
                      format: float
                    severity:
                      type: integer
                      description: The severity level of the vulnerability.
                      format: int32
                    path:
                      type: string
                      description: The file path where the vulnerability was found.
                    description:
                      type: string
                      description: A description of the vulnerability.
                    recommendation:
                      type: string
                      description: Recommended actions to remediate the vulnerability.
                    link:
                      type: string
                      description: A reference link for more information about the vulnerability.
                    sast:
                      properties:
                        committer:
                          type: string
                          description: The email of the person who committed the vulnerable code.
                        file_name:
                          type: string
                          description: The name of the file where the vulnerability was found.
                        code:
                          type: string
                          description: The code snippet where the vulnerability was found.
                        line_number:
                          type: integer
                          description: The line number in the file where the vulnerability was found.
                          format: int32
                        language:
                          type: string
                          description: The programming language of the vulnerable code (e.g., "go").
                      required:
                      - committer
                      - file_name
                      - code
                      - line_number
                      - language
                      type: object
                  required:
                  - name
                  - discovered_by
                  - cwe_id
                  - cvss_v3
                  - severity
                  - path
                  - description
                  - recommendation
                  - link
                  type: object
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"event_id\": \"{eventID}\",\n    \"message\": \"vulnerabilities have been uploaded and analyze event has been started successfully\"\n}"
              schema:
                type: object
                properties:
                  event_id:
                    type: string
                    example: '{eventID}'
                  message:
                    type: string
                    example: vulnerabilities have been uploaded and analyze event has been started successfully
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"error\": \"bad request error\"\n}"
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: bad request error
      deprecated: false
      x-readme:
        code-samples:
        - language: curl
          code: "curl --location --request POST 'https://{hostname}/api/v2/vulnerabilities/import/sast' \\\n--header 'X-Cookie: {token}' \\\n--header 'Content-Type: application/json' \\\n--data-raw '{\n    \"project\": {\n        \"id\": \"{projectID}\"\n    },\n    \"scan_details\": {\n        \"tool\": \"{tool}\",\n        \"branch\": \"{branch}\",\n        \"meta_data\": \"{metaData}\",\n        \"date_discovered\": \"{dateDiscovered}\",\n        \"discovered_by\": \"{discoveredBy}\"\n    },\n    \"vulnerabilities\": [\n        {\n            \"name\": \"{name}\",\n            \"discovered_by\": \"{discoveredBy}\",\n            \"cwe_id\": {CWEID},\n            \"cvss_v3\": {CVSSV3},\n            \"severity\": {severity},\n            \"path\": \"{path}\",\n            \"description\": \"{description}\",\n            \"recommendation\": \"{recomendation}\",\n            \"link\": \"{link}\",\n            \"sast\": {\n                \"committer\": \"{committer}\",\n                \"file_name\": \"{fileName}\",\n                \"code\": \"{code}\",\n                \"line_number\": {lineNumber},\n                \"language\": \"{language}\"\n            }\n        }\n    ]\n}'"
        samples-languages:
        - curl
      tags:
      - Import
  /import/dast:
    post:
      summary: Create a DAST Vulnerability
      description: This endpoint allows you to create DAST vulnerabilities for a specific project. The scan details and vulnerabilities identified during the scan are included in the request body.
      operationId: create-a-dast-vulnerability
      parameters:
      - name: X-Cookie
        in: header
        description: Personal Access Token
        required: true
        schema:
          type: string
          default: Token
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                project:
                  properties:
                    id:
                      type: string
                      description: The unique identifier of the project.
                  required:
                  - id
                  type: object
                scan_details:
                  properties:
                    tool:
                      type: string
                      description: The name of the scanning tool used (e.g., "invicti").
                    branch:
                      type: string
                      description: The branch of the project where the scan was conducted (e.g., "master").
                    meta_data:
                      type: string
                      description: An unique identifier added by the user
                    date_discovered:
                      type: string
                      description: The date and time when the scan was conducted. The format must be ISO 8601 format.
                    discovered_by:
                      type: string
                      description: The person who conducted the scan (e.g., "john").
                  required:
                  - tool
                  - branch
                  - date_discovered
                  - discovered_by
                  type: object
                vulnerabilities:
                  properties:
                    name:
                      type: string
                      description: The name of the vulnerability.
                    cwe_id:
                      type: integer
                      description: The Common Weakness Enumeration (CWE) identifier for the vulnerability.
                      format: int32
                    cvss_v3:
                      type: number
                      description: The Common Vulnerability Scoring System (CVSS) v3 score for the vulnerability.
                      format: float
                    severity:
                      type: integer
                      description: The severity level of the vulnerability.
                      format: int32
                    description:
                      type: string
                      description: A description of the vulnerability.
                    dast:
                      properties:
                        target:
                          type: string
                          description: The target URL where the vulnerability was found.
                        http_request:
                          type: string
                          description: The HTTP request details for reproducing the vulnerability.
                        http_response:
                          type: string
                          description: The HTTP response details indicating the vulnerability.
                        method:
                          type: string
                          description: The HTTP method used in the request (e.g., "GET").
                        references:
                          type: array
                          description: A list of reference links for more information about the vulnerability.
                          items:
                            type: string
                      required:
                      - target
                      - http_request
                      - http_response
                      - method
                      - references
                      type: object
                  required:
                  - name
                  - cwe_id
                  - cvss_v3
                  - severity
                  - description
                  type: object
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"event_id\": \"{eventID}\",\n    \"message\": \"vulnerabilities have been uploaded and analyze event has been started successfully\"\n}"
              schema:
                type: object
                properties:
                  event_id:
                    type: string
                    example: '{eventID}'
                  message:
                    type: string
                    example: vulnerabilities have been uploaded and analyze event has been started successfully
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"error\": \"bad request error\"\n}"
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: bad request error
      deprecated: false
      x-readme:
        code-samples:
        - language: curl
          code: "curl --location --request POST 'https://{hostname}/api/v2/vulnerabilities/import/dast' \\\n--header 'X-Cookie: {token}' \\\n--header 'Content-Type: application/json' \\\n--data-raw '{\n    \"project\": {\n        \"id\": \"{projectID}\"\n    },\n    \"scan_details\": {\n        \"tool\": \"{tool}\",\n        \"branch\": \"{branch}\",\n        \"meta_data\": \"{metaData}\",\n        \"date_discovered\": \"{dateDiscovered}\",\n        \"discovered_by\": \"{discoveredBy}\"\n    },\n    \"vulnerabilities\": [\n        {\n            \"name\": \"{name}\",\n            \"description\": \"{description}\",\n            \"cwe_id\": {CWEID},\n            \"cvss_v3\": {CVSS},\n            \"severity\": {severity},        \n            \"dast\": {\n                \"target\": \"{target}\",\n                \"http_request\": \"{HTTPRequest}\",\n                \"http_response\": \"{HTTPResponse}\",\n                \"method\":\"{method}\",\n                \"references\": [\n                    \"{reference-1}\",\n                    \"{reference-n}\"\n                ]\n            }\n        }\n    ]\n}'"
        samples-languages:
        - curl
      tags:
      - Import
  /import/sca:
