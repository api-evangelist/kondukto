      x-readme:
        code-samples:
        - language: curl
          code: "curl --location --request POST 'https://{hostname}/api/v2/vulnerabilities/import/sca' \\\n--header 'X-Cookie: {token}' \\\n--header 'Content-Type: application/json' \\\n--data-raw '{\n    \"project\": {\n        \"id\": \"{projectID}\"\n    },\n    \"scan_details\": {\n        \"tool\": \"{tool}\",\n        \"branch\": \"{branch}\",\n        \"meta_data\": \"{metaData}\",\n        \"date_discovered\": \"{dateDiscovered}\",\n        \"discovered_by\": \"{discoveredBy}\"\n    },\n    \"vulnerabilities\": [\n        {\n            \"name\": \"{name}\",\n            \"description\": \"{description}\",\n            \"cwe_id\": \"{CWEID}\",\n            \"cvss_v3\": {CVSS},\n            \"severity\": {severity},\n            \"sca\": {\n                \"file_name\": \"{fileName}\",\n                \"license\": \"{license}\",\n                \"references\": [\n                    \"{reference-1}\",\n                    \"{reference-n}\"\n                ],\n                \"packages\": [\n                    \"{pacakge-1}\",\n                    \"{package-2}\",\n                    \"{package-n}\"\n                ]\n            }\n        }\n    ]\n} '"
        samples-languages:
