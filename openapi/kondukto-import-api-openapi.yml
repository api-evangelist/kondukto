      operationId: create-a-pentest-vulnerability
      parameters:
      - name: X-Cookie
        in: header
        description: Personal Access Token
        required: true
        schema:
          type: string
          default: Token
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                project:
                  properties:
                    id:
                      type: string
