              schema:
                type: object
                properties:
                  event_id:
                    type: string
                    example: '{eventID}'
                  message:
                    type: string
                    example: vulnerabilities have been uploaded and analyze event has been started successfully
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \t\"error\": \"bad request error\"\n}"
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: bad request error
      deprecated: false
      x-readme:
