  /api/v2/vulnerabilities/{vulnerabilityID}/screenshots:
    post:
      summary: Upload Attachments
      description: Upload multiple attachments to a vulnerability. Attachment should be in base64 format. Supported file formats are "pdf", "html", "jpg", "png", "avi", "txt" and "mp4".
      operationId: upload-screenshots
      parameters:
      - name: vulnerabilityID
        in: path
        description: Vulnerability ID
        schema:
          type: string
        required: true
      - name: X-Cookie
        in: header
        description: Personal Access Token
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - screenshots
              properties:
                screenshots:
                  type: array
                  items:
                    properties:
                      image:
                        type: string
                        description: Attachment as base64
                        default: data:image/png;base64,{base64Image}
                      description:
                        type: string
                        description: Description of attachment
                      file_detail:
                        type: object
                        description: Detail of file. It is not necessary for image formats.
                        properties:
                          name:
                            type: string
                            description: Name of the file.
                          extension:
                            type: string
                            description: Extension type of the file. It has to begin with `.` (Exp. ".avi", ".pdf")
                    required:
                    - image
                    - description
                    type: object
      responses:
        '200':
          description: '200'
          content:
            text/plain:
              examples:
                Result:
                  value: ''
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    “error”: “failed to parse base64 data for screenshot”\n}"
        '401':
          description: '401'
          content:
            application/json:
              examples:
                Result:
                  value:
                    error: failed to authorize
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: failed to authorize
      deprecated: false
      tags:
      - Vulnerabilities
  /api/v2/vulnerabilities/{vulnerabilityID}/screenshots/{attachmentID}:
    delete:
      summary: Delete An Attachment
      description: Delete an attachment of a vulnerability by attachment id
      operationId: delete-a-screenshot
      parameters:
      - name: vulnerabilityID
        in: path
        description: Vulnerability ID
        schema:
          type: string
        required: true
      - name: attachmentID
        in: path
        description: Attachment ID
        schema:
          type: string
        required: true
      - name: X-Cookie
