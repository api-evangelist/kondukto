openapi: 3.1.0
info:
  title: Invicti ASPM (Kondukto) REST API v2
  version: '2.0'
  description: Public REST API v2 for the Invicti ASPM platform (formerly Kondukto), an Application Security
    Posture Management platform that centralizes SAST, DAST, SCA, container and pentest findings from
    more than eighty scanners. The API manages projects, products, teams, labels, scans and vulnerabilities,
    and is the same public API the open-source KDT command-line client uses. Assembled by API Evangelist
    from the per-operation OpenAPI 3.1 definitions Kondukto publishes on each page of its API reference.
  contact:
    name: Kondukto Support
    email: support@kondukto.io
    url: https://docs.kondukto.io/reference/starting-with-kondukto-api
  x-origin:
  - format: openapi
    version: '3.1'
    url: https://docs.kondukto.io/reference/starting-with-kondukto-api
servers:
- url: https://{hostname}
  description: 'Invicti ASPM deployment host. The platform is deployed per customer (self-hosted or dedicated
    tenant), so there is no single shared public endpoint: set this to your own instance, the same value
    KDT reads from INVICTI_ASPM_HOST. The provider''s own published definitions leave this variable with
    the literal placeholder default "hostname"; api.kondukto.io is used here as a real, provider-owned
    default. It resolves but answers 403 to unauthenticated requests.'
  variables:
    hostname:
      default: api.kondukto.io
      description: Hostname of your Invicti ASPM instance.
security:
- apiToken: []
tags:
- name: Authorization Managers
- name: Labels
- name: Events
- name: Health
- name: Products
- name: Projects
- name: Scanners
- name: Scans
- name: Teams
- name: Users
- name: Vulnerabilities
paths:
  /api/v2/authmans/active:
    get:
      summary: Get Active Authorization Managers
      description: Return active authorization managers
      operationId: get-active-auth-managers
      parameters:
      - name: X-Cookie
        in: header
        description: Personal Access Token
        required: true
        schema:
          type: string
      - name: start
        in: query
        description: Offset for pagination
        schema:
          type: integer
          format: int32
          default: 0
      - name: limit
        in: query
        description: How many records will return
        schema:
          type: string
          default: '30'
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                    active_authmans:
                    - id: '{authToolID}'
                      name: '{authToolName}'
                    - id: '{authToolID}'
                      name: '{authToolName}'
                    limit: 30
                    start: 0
                    total: 2
              schema:
                type: object
                properties:
                  active_authmans:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: '{authToolID}'
                        name:
                          type: string
                          example: '{authToolName}'
                  limit:
                    type: integer
                    example: 30
                    default: 0
                  start:
                    type: integer
                    example: 0
                    default: 0
                  total:
                    type: integer
                    example: 2
                    default: 0
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value:
                    error: failed to get active authmans
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: failed to get active authmans
      deprecated: false
      tags:
      - Authorization Managers
  /api/v2/business_unit_tags/:
    get:
      summary: Get Business Unit Tags
      description: Return business unit tags. Query business unit tags by business unit tag name.
      operationId: get-business-unit-tags
      parameters:
      - name: start
        in: query
        description: Offset for pagination
        schema:
          type: integer
          format: int32
          default: 0
      - name: limit
        in: query
        description: How many records will return
        schema:
          type: integer
          format: int32
          default: 30
      - name: q
        in: query
        description: Business Unit Tag Name (Contains)
        schema:
          type: string
      - name: X-Cookie
        in: header
        description: Personal Access Token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                    limit: 30
                    start: 0
                    total: 2
                    business_unit_tags:
                    - id: 6540ba1d2c753662b184b55e
                      name: Business Unit Tag 1
                      color: 321a1a
                    - id: 645cf4697990ad4f45b41f0e
                      name: Business Unit Tag 2
                      color: 321a1a
              schema:
                type: object
                properties:
                  limit:
                    type: integer
                    example: 30
                    default: 0
                  start:
                    type: integer
                    example: 0
                    default: 0
                  total:
                    type: integer
                    example: 2
                    default: 0
                  business_unit_tags:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: 6540ba1d2c753662b184b55e
                        name:
                          type: string
                          example: Business Unit Tag 1
                        color:
                          type: string
                          example: 321a1a
        '401':
          description: '401'
          content:
            application/json:
              examples:
                Result:
                  value:
                    error: failed to authorize
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: failed to authorize
      deprecated: false
      tags:
      - Labels
  /api/v2/events/{eventID}/status:
    get:
      summary: Get Event Status
      description: Returns status of an event
      operationId: get-event-status
      parameters:
      - name: eventID
        in: path
        description: Event ID
        schema:
          type: string
        required: true
      - name: X-Cookie
        in: header
        description: Personal Access Token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                    active: 0
                    id: '{eventID}'
                    links:
                      html: '{eventLink}'
                    message: ''
                    scan_id: '{scanID}'
                    status: 6
                    status_text: '{statusText}'
              schema:
                type: object
                properties:
                  active:
                    type: integer
                    example: 0
                    default: 0
                  id:
                    type: string
                    example: '{eventID}'
                  links:
                    type: object
                    properties:
                      html:
                        type: string
                        example: '{eventLink}'
                  message:
                    type: string
                    example: ''
                  scan_id:
                    type: string
                    example: '{scanID}'
                  status:
                    type: integer
                    example: 6
                    default: 0
                  status_text:
                    type: string
                    example: '{statusText}'
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value:
                    error: failed to get events
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: failed to get events
        '401':
          description: '401'
          content:
            application/json:
              examples:
                Result:
                  value:
                    error: failed to authorize
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: failed to authorize
      deprecated: false
      tags:
      - Events
  /api/v2/health/check/:
    get:
      summary: Health Check
      description: Api health check
      operationId: health-check
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                    status: ok
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
      deprecated: false
      tags:
      - Health
  /api/v2/labels/:
    get:
      summary: Get Labels
      description: Return labels. Query labels by label name.
      operationId: get-labels
      parameters:
      - name: start
        in: query
        description: Offset for pagination
        schema:
          type: integer
          format: int32
          default: 0
      - name: limit
        in: query
        description: How many records will return
        schema:
          type: integer
          format: int32
          default: 30
      - name: name
        in: query
        description: Label Name (Contains)
        schema:
          type: string
      - name: X-Cookie
        in: header
        description: Personal Access Token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                    start: 0
                    limit: 30
                    total: 1
                    labels:
                    - id: '{labelID}'
                      name: '{labelName}'
              schema:
                type: object
                properties:
                  start:
                    type: integer
                    example: 0
                    default: 0
                  limit:
                    type: integer
                    example: 30
                    default: 0
                  total:
                    type: integer
                    example: 1
                    default: 0
                  labels:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: '{labelID}'
                        name:
                          type: string
                          example: '{labelName}'
        '401':
          description: '401'
          content:
            application/json:
              examples:
                Result:
                  value:
                    error: failed to authorize
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: failed to authorize
      deprecated: false
      tags:
      - Labels
    post:
      summary: Create Label
      description: Create a label
      operationId: create-label
      parameters:
      - name: X-Cookie
        in: header
        description: Personal Access Token
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - color
              - risk_value
              - add_to_all_projects
              properties:
                name:
                  type: string
                  description: Label  name
                  default: label_name
                color:
                  type: string
                  description: Label color as hex format
                  default: AA00FF
                risk_value:
                  type: integer
                  description: Risk level of the label
                  default: 2
                  format: int32
                add_to_all_projects:
                  type: boolean
                  description: Assign the created label to all projects
                  default: false
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"data\": {\n        \"id\": \"label_id\",\n        \"name\": \"label_name\"\
                    ,\n        \"color\": \"ff1f1f\",\n        \"isActive\": 1,\n        \"is_used_sc\"\
                    : false,\n        \"is_used_ic\": false,\n        \"is_used_sla\": false,\n      \
                    \  \"is_used_hv\": false,\n        \"organization\": {\n            \"id\": \"organization_id\"\
                    \n        },\n        \"risk_value\": risk_value,\n        \"is_constant_risk_profile_label\"\
                    : false,\n        \"add_to_all_projects\": true,\n        \"type\": \"user\",\n  \
                    \      \"is_deactivated_from_user\": false,\n        \"auto_label_keywords\": null\n\
                    \    },\n    \"message\": \"label created successfully\"\n}"
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value:
                    error: label already exists
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: label already exists
      deprecated: false
      tags:
      - Labels
  /api/v2/labels/{id}:
    delete:
      summary: Delete Label
      description: Delete a label by ID
      operationId: delete-label
      parameters:
      - name: X-Cookie
        in: header
        description: Personal Access Token
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: Label ID to delete
        schema:
          type: string
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                    message: label deleted successfully
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: label deleted successfully
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value:
                    error: internal labels cannot be deleted
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: internal labels cannot be deleted
      deprecated: false
      tags:
      - Labels
  /api/v2/products/:
    post:
      summary: Create a Product
      description: This endpoint lets you create a new product. The product name should be unique and
        should not contain any spaces.
      operationId: create-a-product
      parameters:
      - name: X-Cookie
        in: header
        description: Personal Access Token
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                  description: Name of the product
                projects:
                  type: array
                  items:
                    properties:
                      id:
                        type: string
                        description: ID of the project
                    required:
                    - id
                    type: object
                default_team:
                  type: object
                  required:
                  - id
                  properties:
                    id:
                      type: string
                      description: ID of the default team
                business_unit_tags:
                  type: array
                  items:
                    properties:
                      id:
                        type: string
                        description: ID of the business unit tag
                    required:
                    - id
                    type: object
      responses:
        '201':
          description: '201'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"product\": {\n        \"id\": \"{productID}\",\n        \"name\": \"\
                    {productName}\",\n        \"projects_count\": {projectCount},\n        \"business_unit_tags\"\
                    : [\n            {\n                \"id\": \"{businessUnitTagID}\",\n           \
                    \     \"name\": \"{businessUnitTagName}\",\n                \"color\": \"{businessUnitTagColor}\"\
                    \n            }\n        ],\n        \"default_team\": {\n            \"id\": \"{defaultTeamID}\"\
                    \n        },\n        \"projects\": [\n            {\n                \"id\": \"{projectID}\"\
                    ,\n                \"name\": \"{projectName}\"\n            },\n            {\n  \
                    \              \"id\": \"{projectID}\",\n                \"name\": \"{projectName}\"\
                    \n            }\n        ],\n        \"links\": {\n            \"html\": \"http://{hostname}/products/view/{productID}/details/appsec\"\
                    \n        }\n    }\n}"
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value:
                    error: invalid request data
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: invalid request data
        '401':
          description: '401'
          content:
            application/json:
              examples:
                Result:
                  value:
                    error: failed to authorize
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: failed to authorize
        '403':
          description: '403'
          content:
            application/json:
              examples:
                Result:
                  value:
                    message: forbidden operation
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: forbidden operation
      deprecated: false
      tags:
      - Products
    get:
      summary: Get Products
      description: Returns the list of products.
      operationId: get-products
      parameters:
      - name: X-Cookie
        in: header
        description: Personal Access Token
        required: true
        schema:
          type: string
          default: Token
      - name: limit
        in: query
        description: How many records will return
        schema:
          type: string
      - name: start
        in: query
        description: Offset for pagination
        schema:
          type: string
      - name: name
        in: query
        description: Product name to filter. Works as "contains"
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                    limit: 30
                    start: 0
                    total: 2
                    products:
                    - id: '{productID}'
                      name: '{productName}'
                      projects_count: 2
                      links:
                        html: http://localhost/products/view/{productID}/details/appsec
                    - id: '{productID}'
                      name: '{productName}'
                      projects_count: 3
                      links:
                        html: http://localhost/products/view/{productID}/details/appsec
              schema:
                type: object
                properties:
                  limit:
                    type: integer
                    example: 30
                    default: 0
                  start:
                    type: integer
                    example: 0
                    default: 0
                  total:
                    type: integer
                    example: 2
                    default: 0
                  products:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: '{productID}'
                        name:
                          type: string
                          example: '{productName}'
                        projects_count:
                          type: integer
                          example: 2
                          default: 0
                        links:
                          type: object
                          properties:
                            html:
                              type: string
                              example: http://localhost/products/view/{productID}/details/appsec
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value:
                    error: invalid request data
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: invalid request data
        '401':
          description: '401'
          content:
            application/json:
              examples:
                Result:
                  value:
                    error: failed to authorize
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: failed to authorize
      deprecated: false
      tags:
      - Products
  /api/v2/products/{productID}:
    patch:
      summary: Update a Product
      description: Overwrites the projects of a product by the given values.
      operationId: update-a-product
      parameters:
      - name: X-Cookie
        in: header
        description: Personal Access Token
        required: true
        schema:
          type: string
      - name: productID
        in: path
        description: Product ID
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Name of the product
                projects:
                  type: array
                  items:
                    properties:
                      id:
                        type: string
                        description: ID of the project
                    required:
                    - id
                    type: object
                default_team:
                  type: object
                  required:
                  - id
                  properties:
                    id:
                      type: string
                      description: ID of the default team
                business_unit_tags:
                  type: array
                  items:
                    properties:
                      id:
                        type: string
                        description: ID of the business unit tag
                    required:
                    - id
                    type: object
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"product\": {\n        \"id\": \"{productID}\",\n        \"name\": \"\
                    {productName}\",\n        \"projects_count\": {projectCount},\n        \"business_unit_tags\"\
                    : [\n            {\n                \"id\": \"{businessUnitTagID}\",\n           \
                    \     \"name\": \"{businessUnitTagName}\",\n                \"color\": \"{businessUnitTagColor}\"\
                    \n            }\n        ],\n        \"default_team\": {\n            \"id\": \"{defaultTeamID}\"\
                    \n        },\n        \"projects\": [\n            {\n                \"id\": \"{projectID}\"\
                    ,\n                \"name\": \"{projectName}\"\n            },\n            {\n  \
                    \              \"id\": \"{projectID}\",\n                \"name\": \"{projectName}\"\
                    \n            }\n        ],\n        \"links\": {\n            \"html\": \"http://{hostname}/products/view/{productID}/details/appsec\"\
                    \n        }\n    }\n}"
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value:
                    error: invalid request data
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: invalid request data
        '401':
          description: '401'
          content:
            application/json:
              examples:
                Result:
                  value:
                    error: failed to authorize
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: failed to authorize
        '403':
          description: '403'
          content:
            application/json:
              examples:
                Result:
                  value:
                    error: forbidden operation
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: forbidden operation
        '404':
          description: '404'
          content:
            application/json:
              examples:
                Result:
                  value:
                    error: product not found
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: product not found
      deprecated: false
      tags:
      - Products
    get:
      summary: Get Product Details
      description: Returns the details of a product.
      operationId: get-a-product-details
      parameters:
      - name: X-Cookie
        in: header
        description: Personal Access Token
        required: true
        schema:
          type: string
          default: Token
      - name: productID
        in: path
        description: Product ID
        schema:
          type: string
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                    product:
                      id: '{productID}'
                      name: '{productName}'
                      projects_count: 3
                      business_unit_tags:
                      - id: '{businessUnitTagID}'
                        name: '{businessUnitTagName}'
                        color: 321a1a
                        isActive: 0
                        required: false
                      accessible_for:
                        owner_ids:
                        - '{userID}'
                        team_ids:
                        - '{teamID}'
                        - '{teamID}'
                      default_team:
                        id: '{teamID}'
                      projects:
                      - id: '{projectID}'
                        name: '{projectName}'
                      - id: '{projectID}'
                        name: '{projectName}'
                      - id: '{projectID}'
                        name: '{projectName}'
                      links:
                        html: http://localhost/products/view/{productID}/details/appsec
              schema:
                type: object
                properties:
                  product:
                    type: object
                    properties:
                      id:
                        type: string
                        example: '{productID}'
                      name:
                        type: string
                        example: '{productName}'
                      projects_count:
                        type: integer
                        example: 3
                        default: 0
                      business_unit_tags:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              example: '{businessUnitTagID}'
                            name:
                              type: string
                              example: '{businessUnitTagName}'
                            color:
                              type: string
                              example: 321a1a
                            isActive:
                              type: integer
                              example: 0
                              default: 0
                            required:
                              type: boolean
                              example: false
                              default: true
                      accessible_for:
                        type: object
                        properties:
                          owner_ids:
                            type: array
                            items:
                              type: string
                              example: '{userID}'
                          team_ids:
                            type: array
                            items:
                              type: string
                              example: '{teamID}'
                      default_team:
                        type: object
                        properties:
                          id:
                            type: string
                            example: '{teamID}'
                      projects:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              example: '{projectID}'
                            name:
                              type: string
                              example: '{projectName}'
                      links:
                        type: object
                        properties:
                          html:
                            type: string
                            example: http://localhost/products/view/{productID}/details/appsec
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value:
                    error: invalid request data
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: invalid request data
        '401':
          description: '401'
          content:
            application/json:
              examples:
                Result:
                  value:
                    error: failed to authorize
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: failed to authorize
      deprecated: false
      tags:
      - Products
  /api/v2/projects/:
    post:
      summary: Create a Project
      description: 'This endpoint lets you create a project with the given parameters. To create a project
        on Kondukto, you can use ALM (Application Lifecycle Management) URL or ALM ID.


        The ALM ID or the ALM URL can be easily retrieved from the CI/CD tools.'
      operationId: create-a-project
      parameters:
      - name: X-Cookie
        in: header
        description: Personal Access Token
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                  description: Name of the project
                source:
                  properties:
                    tool:
                      type: string
                      description: ALM tool name. Not required if there is only one ALM enabled on Kondukto
                    id:
                      type: string
                      description: ALM ID. Kondukto can create projects using the same ID in the ALM
                    url:
                      type: string
                      description: Full URL of the repository. Not required if source.id is set
                    path_scope:
                      properties:
                        include_empty:
                          type: boolean
                          description: Enable to include SAST, SCA and IAC vulnerabilities with no path
                            in this project.
                        included_paths:
                          type: string
                          description: Specify the comma-separated paths within your mono-repo so that
                            Kondukto can decide on the SAST, SCA and IAC vulnerabilities to include in
                            this project.
                        included_files:
                          type: string
                          description: Specify the comma-separated file names Kondukto should check for
                            in vulnerabilities alongside paths
                      required: []
                      type: object
                    clone_disabled:
                      type: boolean
                      description: When set as true it disables clone operations and Kondukto will not
                        be able to retrieve certain information from the ALM tool such as code line, committer
                        etc
                  required: []
                  type: object
                team:
                  properties:
                    id:
                      type: string
                      description: Team ID of the project. Also you can use team name field instead of.
                        Kondukto accepts either one, doesn't need both.
                    name:
                      type: string
                      description: Team name of the project. Also you can use team ID field instead of.
                        Kondukto accepts either one, doesn't need both.
                  required: []
                  type: object
                default_branch:
                  type: string
                  description: Default branch of the project. This field will be overridden by the source's
                    default branch if source.id or source.url is provided.
                  default: main
                labels:
                  type: array
                  description: Labels of project
                  items:
                    properties:
