  /api/v2/vulnerabilities/:
    get:
      summary: Get Vulnerabilities
      description: This endpoint retrieves a list of vulnerabilities from the Kondukto. It supports pagination
        and various filters to streamline the search and retrieval of vulnerability data. Clients can
        specify parameters to filter results based on severity, branch, type, status, and other relevant
        criteria.
      operationId: get-vulnerabilities
      parameters:
      - name: X-Cookie
        in: header
        description: Personal Access Token
        required: true
        schema:
          type: string
      - name: limit
        in: query
        description: The maximum number of vulnerabilities to return per request. Default is 30. Max.
          value can be 30.
        schema:
          type: integer
          format: int32
          default: 30
      - name: start
        in: query
        description: The starting index of the vulnerabilities list. Default is 0.
        schema:
          type: integer
          format: int32
          default: 0
      - name: woe
        in: query
        description: Filters vulnerabilities by their window of exposure. Acceptable operators are eq,
          gt, and lt, followed by the number of days (e.g., woe=eq:15, woe=gt:4, woe=lt:3).
        schema:
          type: string
          default: eq:15
      - name: branch
        in: query
        description: Performs a search on the branch names of the application's source code. Entering
          a partial string will return all branches containing that substring.
        schema:
          type: string
      - name: type
        in: query
        description: Specifies the type of scan, such as "sast", "dast", "sca", "cs", "infra", etc.
        schema:
          type: string
      - name: fp
        in: query
        description: Filters out vulnerabilities when set to "false" or includes only fp when set to "true".
        schema:
          type: boolean
      - name: cvss
        in: query
        description: Filters vulnerabilities based on the CVSS v3 score.
        schema:
          type: number
          format: float
      - name: path
        in: query
        description: Filters vulnerabilities based on the path or target URL. Entering a partial string
          will return all vulnerabilities associated with matching paths or URLs.
        schema:
          type: string
      - name: status
        in: query
        description: Filters vulnerabilities by their status. Possible values are "new", "recurrent",
          and "closed". Multiple statuses can be specified, separated by commas (e.g., status=new,recurrent).
        schema:
          type: string
      - name: cwe_name
        in: query
        description: Filters vulnerabilities based on the name of the CWE. Entering a partial string will
          return all vulnerabilities associated with matching CWE names.
        schema:
          type: string
      - name: cwe_no
        in: query
        description: Filters vulnerabilities based on CWE numbers. Multiple CWE numbers can be specified,
          separated by commas (e.g., cwe_no=79,89,20).
        schema:
          type: integer
          format: int32
      - name: tool_name
        in: query
        description: Filters vulnerabilities by the exact name of the tool that identified them. This
          parameter requires an exact match. If no alphanumeric value is entered, this parameter will
          not work.
        schema:
          type: string
      - name: issue_status
        in: query
        description: Filters vulnerabilities based on the status of any associated issue. This parameter
          requires an exact match and can take values like "open", "closed".
        schema:
          type: string
      - name: committers
        in: query
        description: Filters vulnerabilities based on the email of committers. This is a searchable parameter
          that accepts multiple values. Each value can be a part of the full string, separated by commas
          (e.g., committers=john@kondukto.io, appsec_user)
        schema:
          type: string
      - name: from
        in: query
        description: Filters vulnerabilities based on the date and time they were first seen, starting
          from the specified ISO 8601 date (e.g., 2024-05-08T12:20:57.588Z).
        schema:
          type: string
          format: date
      - name: to
        in: query
        description: Filters vulnerabilities based on the date and time they were first seen, up to the
          specified ISO 8601 date (e.g., 2024-05-08T12:20:57.588Z).
        schema:
          type: string
          format: date
      - name: tp
        in: query
        description: Filters out vulnerabilities marked as true positives when set to "false" or includes
          only true positives when set to "true".
        schema:
          type: boolean
      - name: id
        in: query
        description: Filters vulnerabilities by their unique identification number. This parameter allows
          for direct access to specific vulnerability.
        schema:
          type: string
      - name: teams
        in: query
        description: Filters vulnerabilities based on the names of teams the vulnerabilities. Multiple
          team names can be specified, separated by commas (e.g., teams=security,development).
        schema:
          type: array
          items:
            type: string
      - name: vuln_name
        in: query
        description: Filters vulnerabilities based on their name. This is a searchable parameter that
          supports partial matching. Entering a partial name will return all vulnerabilities containing
          that substring.
        schema:
          type: string
      - name: project_name
        in: query
        description: Filters vulnerabilities based on the name of the project. This is a searchable parameter
          that supports partial matching. Entering a partial project name will return all vulnerabilities
          containing that substring.
        schema:
          type: string
      - name: product_name
        in: query
        description: Filters vulnerabilities by the exact name of the product that identified them. This
          parameter requires an exact match.
        schema:
          type: string
      - name: team_ids
        in: query
        description: Filters vulnerabilities based on the identifiers of the teams involved. Multiple
          team IDs can be specified, separated by commas (e.g., team_ids=661e36fbb3bdf42202f9eb12,65a78ae2710eb82e835b78c8).
        schema:
          type: array
          items:
            type: string
      - name: label_ids
        in: query
        description: Filters vulnerabilities based on the identifiers of the labels involved. Multiple
          label IDs can be specified, separated by commas (e.g., label_ids=661e36fbb3bdf42202f9eb12,65a78ae2710eb82e835b78c8).
        schema:
          type: array
          items:
            type: string
      - name: severity
        in: query
        description: Filters vulnerabilities by specified severity levels. Multiple severities can be
          specified, separated by commas (e.g., severity=1,2).
        schema:
          type: array
          items:
            type: integer
            format: int32
      - name: labels
        in: query
        description: Filters vulnerabilities based on the names of the labels involved. Multiple labels
          can be specified, separated by commas (e.g., labels=appsec,infrasecurity).
        schema:
          type: array
          items:
            type: string
      - name: overdue
        in: query
        description: Filters out vulnerabilities when set to "false" or includes only overdue when set
          to "true".
        schema:
          type: boolean
