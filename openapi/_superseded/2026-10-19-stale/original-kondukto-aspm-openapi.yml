  /api/v2/scans/create:
    post:
      summary: Create New Scan
      description: This endpoint allows you to create a new scan with specified parameters for a project.
        You can access the "custom" information in the body parameters from the Scanner details.
      operationId: create-new-scan
      parameters:
      - name: X-Cookie
        in: header
        description: Personal Access Token
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - scanparams_id
              - branch
              - project
              - tool_id
              properties:
                scanparams_id:
                  type: string
                  description: The unique identifier for the scan parameters.
                branch:
                  type: string
                  description: The branch of the project where the scan will be conducted (e.g., "master").
                meta_data:
                  type: string
                  description: Additional metadata associated with the scan.
                project:
                  type: string
                  description: The unique identifier of the project.
                tool_id:
                  type: string
                  description: The unique identifier for the scanning tool to be used (e.g., "650c518c7495187ed927cd22").
                pr:
                  properties:
                    ok:
                      type: boolean
                      description: Indicator whether the scan is associated with a pull request.
                    target:
                      type: string
                      description: The target branch for the pull request.
                    ' pr_number':
                      type: string
                      description: The pull request number.
                    no_decoration:
                      type: boolean
                      description: Indicator whether to disable decorations on the pull request.
                  required:
                  - ok
                  - target
                  - ' pr_number'
                  - no_decoration
                  type: object
                custom:
                  properties:
                    type:
                      type: integer
                      description: The type of custom parameters.
                      format: int32
                    params:
                      type: string
                      description: Object containing specific custom parameters.
                      format: json
                  required:
                  - type
                  - params
                  type: object
                fork_scan:
                  type: boolean
                  description: Indicator whether the scan is a fork scan.
                fork_source_branch:
                  type: string
                  description: The source branch for the fork scan.
                override_fork_source_branch:
                  type: boolean
                  description: Indicator whether to override the fork source branch.
                environment:
                  type: string
                  description: The environment in which the scan will be conducted.
                scheduled:
                  type: boolean
                  description: Indicator whether to create scheduled scans.
                  default: false
                api_rrule:
                  type: object
                  description: Schedule scan rule configuration
                  required:
                  - frequency
                  - interval
                  properties:
                    frequency:
                      type: integer
                      description: Frequency Hourly = 1, Frequency Daily=2, Frequency Weekly=3, Frequency
                        Monthly=4
                      format: int32
                    interval:
                      type: integer
                      format: int32
                    count:
                      type: integer
                      format: int32
                    days_of_week:
                      type: array
                      description: Required if the frequency is weekly (Monday=1, Tuesday=2, Wednesday=3,
                        Thursday=4, Friday=5, Saturday=6, Sunday=7)
                      items:
                        type: integer
                        format: int32
                    days_of_month:
                      type: array
                      description: Required if the frequency is monthly (Values should be between 1 -
                        31)
                      items:
                        type: integer
                        format: int32
                    start_date:
                      type: string
                      description: Expected format (2006-01-02T15:04:05Z)
                      default: Now
                      format: date
                    end_date:
                      type: string
                      description: Expected format (2006-01-02T15:04:05Z)
                      format: date
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                    event_id: '{eventID}'
                    message: scan created successfully
              schema:
                type: object
                properties:
                  event_id:
                    type: string
                    example: '{eventID}'
                  message:
                    type: string
                    example: scan created successfully
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value:
                    error: bad request error
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: bad request error
      deprecated: false
      tags:
      - Scans
