notes: >-
  Kondukto (now Invicti ASPM) ships one first-party client: KDT, an open-source Go command-line
  client that talks to the same public REST API v2 documented at docs.kondukto.io/reference. There
  are no first-party language SDKs published to npm, PyPI, Maven Central, NuGet, RubyGems, Packagist
  or crates.io; KDT is distributed as a Go module, an install script at cli.kondukto.io, GitHub
  release binaries, and a GitHub Action. Integration is otherwise done directly against the REST API.
