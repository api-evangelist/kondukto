aid: kondukto
name: Kondukto
description: >-
  Kondukto — now shipped as Invicti ASPM following Invicti Security's acquisition of the company — is
  an Application Security Posture Management platform that centralizes and automates the AppSec
  vulnerability management lifecycle. It ingests, deduplicates and correlates findings from more than
  eighty security scanners across SAST, DAST, SCA, container, infrastructure and pentest testing,
  enriches them with CWE, CVSS, EPSS, CISA KEV, EUVD threat intelligence and VEX exploitability data,
  and routes them to owning teams through Jira, GitLab, ServiceNow and webhook issue managers.
  Kondukto publishes a documented REST API v2 covering projects, products, teams, labels, scans and
  vulnerabilities, an open-source Go command-line client (KDT) that drives the same API from CI/CD
  pipelines, and a webhook surface for both outbound platform events and customer-hosted issue
  managers. The platform is deployed per customer, so the API host is deployment-specific.
