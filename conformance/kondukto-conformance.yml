notes: >-
  Standards conformance for the Invicti ASPM (Kondukto) REST API v2, derived from the provider's own
  published operation definitions and searched against the documentation. Kondukto's domain is
  application security posture management, so the meaningful standards are the AppSec data formats
  it ingests and emits (SARIF, CycloneDX, SPDX, CVE/CWE/CVSS, EPSS, VEX) rather than financial or
  healthcare API profiles. Enterprise compliance certifications are tracked separately in
  security/kondukto-trust-center.yml.
