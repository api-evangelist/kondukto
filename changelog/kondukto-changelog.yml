- version: v1.112.0
  date: '2026-05-27'
  url: https://docs.kondukto.io/changelog/invicti-aspm-release-v11120
  breaking: false
  highlights:
  - CheckmarxOne API Security integration ingests API security findings alongside SAST results.
  - Multi-provider AI support for pull-request remediation advice, replacing the single-provider implementation.
  - EUVD (European Union Vulnerability Database) added as a Threat Intelligence source.
  - VEX (Vulnerability Exploitability eXchange) support ingesting applicability data from JFrog Xray, Snyk and BlackDuck.
  - AI-based CWE predictor fills missing CWE classifications via vector similarity matching.
  - Wiz tag filtering plus finding status, CVSS score and detection date cloud filters.
  - Infrastructure group severity and name filters added to the infrastructure vulnerability search endpoint.
  - Runtime Exposure page redesigned to match the DAST-SAST Correlation design.
- version: v1.111
